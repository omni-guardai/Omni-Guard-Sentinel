[package]
name = "sentinel_agent"
version = "0.1.0"
edition = "2021"
description = "Omni-Guard AI Sentinel Endpoint Agent for Real-Time Ransomware Extinction"

[dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
base64 = "0.22"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
