[package]
name = "sentinel_agent"
version = "0.1.0"
edition = "2021"
description = "Omni-Guard AI Sentinel Endpoint Agent for Real-Time Ransomware Extinction"

[lib]
name = "sentinel_core"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[[bin]]
name = "sentinel_agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
rand = "0.8"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
jni = "0.21"
sysinfo = "0.30"

# Cross-platform secure network communication feature layers
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
