name: Sentinel Mobile APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Rust & Android Targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
        
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
      
    - name: Compile Rust Engine
      run: cargo ndk -t arm64-v8a build --release
      
    - name: Inject Rust Core into Android Shell
      run: cp target/aarch64-linux-android/release/libsentinel_core.so android-app/app/src/main/jniLibs/arm64-v8a/
      
    - name: Compile Android APK
      working-directory: ./android-app
      run: gradle assembleDebug
      
    - name: Upload Final APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sentinel-AI-App
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
