name: Sentinel Mobile Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust & Android Targets
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
        
    - name: Install cargo-ndk
      run: cargo install cargo-ndk
      
    - name: Compile Android Dynamic Library
      run: cargo ndk -t arm64-v8a build --release
      
    - name: Package Core Engine for APK
      run: |
        mkdir -p Omni-Guard-Sentinel-Android/lib/arm64-v8a
        cp target/aarch64-linux-android/release/libsentinel_agent.so Omni-Guard-Sentinel-Android/lib/arm64-v8a/
        zip -r android-sentinel-package.zip Omni-Guard-Sentinel-Android
      
    - name: Upload Android Artifact to Cloud
      uses: actions/upload-artifact@v3
      with:
        name: android-sentinel-package
        path: android-sentinel-package.zip
