name: Universal Release Forge

on:
  push:
    tags:
      - 'v*'

jobs:
  forge-assets:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - platform: windows-latest
            ext: ".exe"
            os_name: "windows"
          - platform: macos-latest
            ext: ""
            os_name: "macos"
          - platform: ubuntu-latest
            ext: ""
            os_name: "linux"

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize Rust Environment
        uses: dtolnay/rust-toolchain@stable

      - name: Run Build Sequence
        run: cargo build --release --bin sentinel_agent

      - name: Upload Windows Binary to Release Hub
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/sentinel_agent.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Mac & Linux Binaries to Release Hub
        if: matrix.platform != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/sentinel_agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Asset to Omni-Guard AI Core
        run: |
          VERSION="${{ github.ref_name }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/sentinel_agent${{ matrix.ext }}"
          
          curl -X POST https://omni-guard-ai.web.app/api/v1/enterprise/sentinel/sync-release \
            -H "Content-Type: application/json" \
            -H "X-Sentinel-Sync-Token: ${{ secrets.CORE_SYNC_SECRET }}" \
            -d "{
              \"version\": \"${VERSION}\",
              \"platform\": \"${{ matrix.os_name }}\",
              \"fileExtension\": \"${{ matrix.ext }}\",
              \"downloadUrl\": \"${URL}\"
            }"
